providers = ["python"]

[variables]
NIXPACKS_PYTHON_VERSION = "3.12"

# Keep default Nixpacks packages ("...") and add gcc for native wheels (e.g. pyarrow).
# Do not override the Python install phase — Nixpacks installs from requirements.txt.
[phases.setup]
nixPkgs = ["...", "gcc"]

[start]
cmd = "uvicorn src.api.routes:app --host 0.0.0.0 --port $PORT"
